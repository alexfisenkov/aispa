<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Onest:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Вид — AISpa 0.5 «Графит»: центрованный лист, белые карточки 28 px на светло-сером, тёмная главная карточка с бликом,
     надзаголовки разреженными заглавными с чертой, серые плитки внутри карточек, тонированные плашки с цветной обводкой.
     Цвет здесь — сигнал, а не украшение: у каждого состояния сборки свой.
     Графит — идёт работа, хром — ждём человека, синий — задача пишется,
     зелёный — сдано, бирюзовый — проверка, янтарный — ремонт, красный — упало.
     Палитра — AISpa 0.5: графит, хром, синий, бирюзовый, ремонт #854D0E, упало #991B1B и светлые плашки.
     Производные (в 0.5 такой роли нет): --done #18784E (темнее #1F8A5B ради белого текста AA), --tx2, --line2,
     #34A56F на полосе этапов. */
  :root{
    --bg:#F4F5F6; --card:#FFFFFF; --inset:#F4F5F6; --soft:#ECEDEF; --line:#E3E4E7; --line2:#D5D7DB;
    --tx:#181A1C; --tx2:#3A3C40; --mut:#55585E; --quiet:#62666D;
    --graphite:#171717; --silver:#C7C9CC; --press:#171717; --press-tx:#FFFFFF; --press-line:transparent;
    --chrome:linear-gradient(180deg,#FFFFFF 0%,#E0E2E5 40%,#A9ACB1 62%,#EEF0F2 100%);
    --page:radial-gradient(1200px 600px at 80% -10%,#FFFFFF,transparent 70%);
    --hero:linear-gradient(165deg,#202123 0%,#0E0E10 100%);
    --hero-sh:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 rgba(255,255,255,.12);
    --done:#18784E; --done-soft:#DCFCE7; --done-tx:#166534;
    --now:#1D4ED8; --now-on:#FFFFFF; --now-soft:#DBEAFE; --now-tx:#1D4ED8;
    --rev:#0F766E; --rev-soft:#CCFBF1; --rev-tx:#0F766E;
    --fix:#854D0E; --fix-soft:#FEF3C7; --fix-tx:#854D0E;
    --bad:#991B1B; --bad-soft:#FEE2E2; --bad-tx:#991B1B;
    --idle:#C7C9CC; --eyeline:rgba(23,23,23,.45); --cur:#171717; --pastline:#171717;
    --sh:0 20px 60px rgba(20,20,22,.10);
    --sh-btn:0 10px 26px rgba(23,23,23,.22);
    --sh-tab:0 4px 12px rgba(20,20,22,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
      --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
      --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
      --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
      --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
      --done-soft:#123523; --done-tx:#86EFAC;
      --now-soft:#192E50; --now-tx:#93C5FD;
      --rev-soft:#123D38; --rev-tx:#99F6E4;
      --fix-soft:#3D3217; --fix-tx:#FDE68A;
      --bad-soft:#431C22; --bad-tx:#FCA5A5;
      --idle:#5A5D63; --eyeline:rgba(255,255,255,.5); --cur:#383A40; --pastline:#B9BBC1;
      --sh:0 20px 60px rgba(0,0,0,.24);
      --sh-btn:0 10px 26px rgba(0,0,0,.35);
      --sh-tab:0 4px 12px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
    --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
    --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
    --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
    --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
    --done-soft:#123523; --done-tx:#86EFAC;
    --now-soft:#192E50; --now-tx:#93C5FD;
    --rev-soft:#123D38; --rev-tx:#99F6E4;
    --fix-soft:#3D3217; --fix-tx:#FDE68A;
    --bad-soft:#431C22; --bad-tx:#FCA5A5;
    --idle:#5A5D63; --eyeline:rgba(255,255,255,.5); --cur:#383A40; --pastline:#B9BBC1;
    --sh:0 20px 60px rgba(0,0,0,.24);
    --sh-btn:0 10px 26px rgba(0,0,0,.35);
    --sh-tab:0 4px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--page),var(--bg);color:var(--tx);
    font:15px/1.5 'Onest',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-synthesis-weight:none}
  ::selection{background:rgba(199,201,204,.4)}
  /* Фокус как в панели 0.5: контур цвета основного текста темы; на тёмных плашках — светлый контур и серебряное гало. */
  :focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  .tabs button:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.btn-soft:focus-visible{box-shadow:0 0 0 5px rgba(199,201,204,.4)}
  .hero:not(.ask) :focus-visible{outline-color:#fff;box-shadow:0 0 0 5px rgba(199,201,204,.4)}
  code,.mono{font-family:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .tnum,.tbig,.tv,.s-time,.ev em{font-variant-numeric:tabular-nums}
  /* Лист 0.5: до 1280 px содержимого по центру, поля clamp(16px,3vw,44px), между блоками 22 px. */
  .wrap{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:28px clamp(16px,3vw,44px) 64px;display:flex;flex-direction:column;gap:22px;min-width:0}
  .wrap>*{min-width:0}
  .card{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:clamp(20px,2.4vw,30px);min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  /* Надзаголовок секции, как «— ПРОВЕРКИ» в 0.5: Unbounded 11 px, разрядка .24em, черта слева. */
  .wt{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--quiet);margin:0;line-height:1.6;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere;min-width:0}
  .wt::before{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--eyeline))}
  .whead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:13px;color:var(--quiet)}

  /* ── верх ─────────────────────────────────────────────────── */
  .top{display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap}
  /* Шапка бренда, как в 0.5: ссылка-блок на канал, знак, «AI мастерская» и «AISpa». */
  .brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-right:auto;min-width:0}
  .brand-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-right:auto;min-width:0}
  .brand-row .brand{margin-right:0}
  /* Плашка версии и индикатор связи — как в шапке 0.5. */
  .vpill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);line-height:1.3;overflow-wrap:anywhere}
  .source{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);min-width:0}
  .source .sdot{width:8px;height:8px;border-radius:999px;flex:none;background:var(--silver)}
  .source.s-live .sdot{background:#1F8A5B}
  .source.s-lost .sdot,.source.s-snap .sdot{background:var(--quiet)}
  .pref{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--tx);font:600 13px 'Onest',-apple-system,sans-serif;cursor:pointer}
  .pref:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  .btn{height:44px;padding:0 20px;border:1px solid var(--press-line);border-radius:15px;background:var(--press);color:var(--press-tx);font:600 14px 'Onest',-apple-system,sans-serif;cursor:pointer;
    box-shadow:var(--sh-btn);display:inline-flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--tx);outline-offset:3px;box-shadow:0 0 0 5px rgba(199,201,204,.4)}
  .btn span{background:linear-gradient(100deg,#9A9DA2 0%,#FFFFFF 50%,#9A9DA2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn.busy .arr{animation:pulse .8s linear infinite}
  .brand-link{display:flex;align-items:center;gap:14px;color:var(--tx);text-decoration:none;border-radius:12px}
  .brand-link:focus-visible{outline:2px solid var(--tx);outline-offset:5px}
  .brand h1{display:block;margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-weight:700;font-size:25px;line-height:1.1;letter-spacing:-.01em}
  .brand small{display:block;margin-bottom:3px;font-size:12px;color:var(--quiet)}
  .logo{width:50px;height:50px;flex:none;filter:drop-shadow(0 6px 12px rgba(20,20,22,.18))}
  .logo svg{display:block;width:100%;height:100%}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  /* Переключатели — белые с обводкой, как выпадающие списки 0.5; нажатое — графит, как текущий этап. */
  .tabs{display:inline-flex;gap:0;padding:0;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .tabs button,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tabs button{height:44px;min-width:46px;padding:0 13px;border-radius:11px;background:transparent;color:var(--mut);font-size:13px;font-weight:600;transition:background .2s,color .2s}
  .tabs button:hover{color:var(--tx)}
  .tabs button[aria-pressed="true"]{background:var(--press);color:var(--press-tx)}
  /* «Обновить» — графитовая кнопка 0.5 с тенью и подъёмом. */
  .iconbtn{width:46px;height:46px;border-radius:15px;background:var(--press);color:var(--press-tx);border:1px solid var(--press-line);box-shadow:var(--sh-btn);transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .iconbtn:hover{transform:translateY(-2px)}
  .iconbtn:active{transform:scale(.96)}
  /* «Обновить сейчас»: пока state.js грузится, стрелка крутится — нажатие видно */
  .iconbtn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title h1{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mut);line-height:1.3}
  .meta .when{font-size:13px;color:var(--mut);margin-left:4px}
  #link{background:var(--now-soft);color:var(--now-tx);border:1px solid currentColor;border-radius:12px;padding:12px 15px;font-weight:600;font-size:14px;line-height:1.5;margin-bottom:0}
  .lost{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:16px clamp(16px,3vw,44px) 0}

  /* ── шапка состояния: тёмная карточка 0.5 с серебряным бликом справа сверху ── */
  .hero{--h-tx:#fff;--h-mut:rgba(255,255,255,.82);--h-track:rgba(255,255,255,.22);--h-line:rgba(255,255,255,.14);--h-fill:rgba(255,255,255,.06);--h-cur:#383A40;--h-cur-line:#52545A;
    --glow:radial-gradient(520px 520px at calc(100% + 140px) -100px,rgba(199,201,204,.20),transparent 70%);
    border-radius:28px;padding:clamp(20px,2.4vw,30px);display:flex;flex-direction:column;gap:26px;
    background:var(--glow),var(--hero);color:var(--h-tx);box-shadow:var(--hero-sh);min-width:0}
  .hero.ask{background:var(--glow),linear-gradient(165deg,#FFFFFF 0%,#E0E2E5 45%,#C7C9CC 100%);--h-tx:#171717;--h-mut:rgba(23,23,23,.78);--h-track:rgba(23,23,23,.16);--h-line:rgba(23,23,23,.14);--h-fill:rgba(23,23,23,.05);--h-cur:#171717;--h-cur-line:#171717;
    box-shadow:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 #fff}
  .hero.won{background:var(--glow),linear-gradient(165deg,#18784E 0%,#10593A 100%);--h-mut:rgba(255,255,255,.9);--h-track:rgba(255,255,255,.26);--h-line:rgba(255,255,255,.2);--h-fill:rgba(255,255,255,.05);--h-cur:rgba(0,0,0,.22);--h-cur-line:rgba(255,255,255,.3);box-shadow:0 40px 90px rgba(24,120,78,.22),inset 0 1px 0 rgba(255,255,255,.16)}
  .hero.bad{background:var(--glow),linear-gradient(165deg,#A82121 0%,#851717 100%);--h-track:rgba(255,255,255,.26);--h-line:rgba(255,255,255,.2);--h-fill:rgba(255,255,255,.08);--h-cur:rgba(0,0,0,.22);--h-cur-line:rgba(255,255,255,.3);box-shadow:0 40px 90px rgba(153,27,27,.2),inset 0 1px 0 rgba(255,255,255,.16)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 20px}
  .hero-main{min-width:0;margin-top:-8px}
  /* Надзаголовок главной карточки 0.5: «AISPA · проект». */
  .hwt{margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--h-mut);
    display:flex;align-items:center;gap:10px;line-height:1.6;min-width:0;overflow-wrap:anywhere;flex:1 1 260px}
  .hwt::before{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--h-mut))}
  /* Состояние — плашка-пилюля 0.5 («● В работе»). */
  .state{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;background:var(--h-fill);border:1px solid var(--h-line);font-size:13px;font-weight:600;color:var(--h-tx)}
  /* Строка фактов 0.5: подпись сверху, значение снизу. */
  .facts{display:flex;flex-wrap:wrap;gap:10px 32px;font-size:12px;color:var(--h-mut);margin:0}
  .facts div{display:grid;gap:3px;min-width:0}
  .facts dt{margin:0}
  .facts dd{margin:0;font-size:13px;font-weight:600;color:var(--h-tx);overflow-wrap:anywhere}
  .facts dd.mono{font-weight:500}
  /* «Данные прогона» — раскрываемый блок под чертой, как run-context в 0.5. */
  .runctx{border-top:1px solid var(--h-line);padding-top:6px;margin-top:-10px}
  .runctx>summary{display:flex;align-items:center;gap:6px;width:fit-content;min-height:32px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--h-mut);border-radius:6px}
  .runctx>summary::-webkit-details-marker{display:none}
  .runctx>summary::before{content:'▸'}
  .runctx[open]>summary::before{content:'▾'}
  .runctx>summary:hover{color:var(--h-tx)}
  .rkv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 18px;margin:8px 0 2px;font-size:13px;line-height:1.45}
  .rkv dt{color:var(--h-mut)}
  .rkv dd{margin:0;color:var(--h-tx);overflow-wrap:anywhere}
  .rkv code{font-size:12.5px}
  .hero h2{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.02em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16px;line-height:1.55;color:var(--h-mut);max-width:64ch}
  .lead b{color:var(--h-tx);font-weight:600}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 20px;border-radius:15px;background:#171717;color:#fff;font-size:14px;font-weight:600;line-height:1.35;box-shadow:0 10px 26px rgba(23,23,23,.22)}
  /* Блок «Этап» 0.5: белая карточка, шаги 01–08, пройденные — серые с графитовой чертой, текущий — графит с хромом. */
  .rowh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:12px}
  .sh{margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-weight:600;font-size:17px}
  .rowh>span{font-size:13px;color:var(--quiet)}
  .stgc{padding:16px 20px;border-radius:24px}
  .stgs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
  .stg{display:flex;flex-direction:column;gap:6px;padding:8px 10px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--quiet);min-width:0}
  .stg>i{display:block;height:2px;border-radius:999px;background:var(--line)}
  .stg small{font-family:'Unbounded','Onest',sans-serif;font-size:11px;opacity:.75}
  .stg b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .stg.past{background:var(--inset);color:var(--tx)}
  .stg.past>i{background:var(--pastline)}
  .stg.cur{background:var(--cur);color:#fff;border-color:var(--cur)}
  .stg.cur>i{background:linear-gradient(90deg,#9A9DA2,#FFFFFF,#9A9DA2) 0 0/200% 100%;animation:chromeShine 2.4s linear infinite}
  .stg.fail{background:var(--bad-soft);color:var(--bad-tx);border-color:currentColor}
  .stg.fail>i{background:currentColor}
  .stg.skip{border-style:dashed}
  .stg.skip>i{background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
  @keyframes chromeShine{from{background-position:200% 0}to{background-position:-200% 0}}
  .s-time{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;opacity:.8}
  .stg-foot{margin:12px 0 0;font-size:13px;font-weight:600}
  /* Карточка времени 0.5: «Время прогона» слева, «Примерно до завершения» справа за чертой. */
  .timec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;padding:20px clamp(20px,2.4vw,30px)}
  .tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .tcol+.tcol{border-left:1px solid var(--line);padding-left:28px}
  .tlb{font-size:12.5px;color:var(--mut)}
  .tlb::first-letter{text-transform:uppercase}
  .tbig{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
  .tbig small{font-size:16px;font-weight:600;margin-left:4px}
  .tbig.dim{font-family:'Onest',-apple-system,sans-serif;font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
  .tnote{font-size:12.5px;line-height:1.5;color:var(--quiet);max-width:62ch;text-wrap:pretty}
  .tnote.paused{font-weight:600;color:var(--fix-tx)}
  /* Требования: заголовок слева, фильтры справа, как в 0.5. */
  .reqh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:12px}
  .reqh>div:first-child{min-width:0}
  .reqh .chips{margin-bottom:0}
  /* Остатки и решения агента — нижний ряд 0.5. */
  .lower{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;align-items:start}
  .lower>*{min-width:0}
  .lower .bh{font-size:22px}
  .rem-group{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .rem-group>span{font-family:'Unbounded','Onest',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--quiet)}
  .rem{display:flex;gap:12px;padding:13px 15px;border-radius:14px;background:var(--inset);border-left:3px solid var(--tx);min-width:0}
  .rem>span.mono{flex:none;font-size:13px;color:var(--mut);padding-top:2px}
  .rem>div{min-width:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
  .rem small{display:block;font-size:12.5px;color:var(--quiet);margin-top:3px}
  .rem-group .btn-soft{align-self:flex-start}
  .clean{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--inset);font-size:15px;color:var(--tx2)}
  .card.dark{background:radial-gradient(520px 520px at calc(100% + 140px) -100px,rgba(199,201,204,.20),transparent 70%),var(--hero);color:#fff;box-shadow:var(--hero-sh)}
  .card.dark .bsub{color:#C7C9CC}
  .dec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid rgba(255,255,255,.14)}
  .dec>span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#A9ACB1;padding-top:3px}
  .dec>p{margin:0;font-size:15px;line-height:1.5;color:#ECEDEF;overflow-wrap:anywhere}
  .dec-h{margin:18px 0 0;font-size:12.5px;color:#C7C9CC}
  .card.dark .muted{color:#C7C9CC;margin-top:16px}
  .card.dark .btn-soft{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);margin-top:10px}
  /* История — свёрнутая карточка 0.5 с числом событий. */
  .hist{padding:14px clamp(20px,2.4vw,30px)}
  .hist>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer;list-style:none;border-radius:8px}
  .hist>summary::-webkit-details-marker{display:none}
  .hist>summary h3{margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:15px;font-weight:600}
  .hist>summary>span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--mut)}
  .hist>summary:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  .hlist{margin-top:6px}
  .gates4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .gates4 .gate{margin-top:0}
  .live{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#171717}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .badge-ic{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .badge-ic .ic.xs{width:12px;height:12px}
  .hero.won .badge-ic{color:#18784E}.hero.bad .badge-ic{color:#991B1B}
  .stripes{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
  @keyframes stripes{to{background-position:22px 0}}

  /* ── плитки: белые карточки 0.5 ───────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px}
  .tile{display:flex;flex-direction:column;gap:12px;padding:22px 24px;border-radius:24px}
  .tk{font-size:13px;font-weight:500;color:var(--mut)}
  .tv{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:36px;line-height:1;font-weight:700;letter-spacing:-.04em}
  .tv small{font-size:16px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
  .tv.dim{color:var(--quiet)}
  .ts{font-size:13px;color:var(--mut);line-height:1.45}
  .stack{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line)}
  .stack i{display:block;height:100%}
  .stack .stripes{animation:none;background-image:none}
  .sq{display:flex;gap:5px;flex-wrap:wrap}
  .sq i{width:16px;height:16px;border-radius:5px;display:block}
  .sq .stripes{animation:none}
  .okb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:600;line-height:1.4;align-self:flex-start;border:1px solid currentColor}
  .okb.f-done{background:var(--done-soft);color:var(--done-tx)}
  .okb.f-bad{background:var(--bad-soft);color:var(--bad-tx)}

  /* ── цвета статусов ───────────────────────────────────────── */
  .f-done{background:var(--done);color:#fff}
  .f-now{background-color:var(--now);color:var(--now-on)}
  .f-rev{background:var(--rev);color:#fff}
  .f-fix{background:var(--fix);color:#fff}
  .f-bad{background:var(--bad);color:#fff}
  .f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .f-idle{background:var(--idle)}
  .f-q{background:var(--quiet)}

  /* ── задачи по волнам: как в AISpa 0.5 ────────────────────── */
  .bh{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
  .bsub{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--mut);max-width:80ch}
  .waves{display:flex;flex-direction:column;gap:26px;margin-top:24px}
  /* Волна: хромовый шарик с номером, счёт сданного справа, полоска прогресса, черта между волнами. */
  .wave{display:flex;flex-direction:column;gap:12px}
  .wave+.wave{padding-top:24px;border-top:1px solid var(--line)}
  .wave-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
  .wave-head>div{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
  .wave-head>span{font-size:13px;color:var(--quiet)}
  .wn{width:34px;height:34px;border-radius:999px;background:var(--chrome);box-shadow:inset 0 1px 2px #fff,0 4px 10px rgba(20,20,22,.14);display:grid;place-items:center;
    font-family:'Unbounded','Onest',sans-serif;font-style:normal;font-weight:700;font-size:13px;color:#171717;flex:0 0 auto}
  .wbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .wbar i{display:block;height:100%;border-radius:inherit;background:var(--done)}
  .wave-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--mut)}
  /* Задача: серая карточка, цвет состояния — полосой слева и точкой у подписи. */
  .task{background:var(--inset);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:16px;min-width:0}
  .task.k-done{border-left-color:var(--done)}.task.k-now{border-left-color:var(--now)}.task.k-rev{border-left-color:var(--rev)}
  .task.k-fix{border-left-color:var(--fix)}.task.k-bad{border-left-color:var(--bad)}
  .th{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 16px 12px}
  .t-id{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--mut);padding-top:2px}
  .t-nm{margin:0;font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
  .t-rq{display:block;margin-top:2px;font-size:12.5px;color:var(--quiet);overflow-wrap:anywhere}
  .t-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;min-width:0}
  .t-st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:0 0 auto}
  .k-done .dot{background:var(--done-tx)}.k-now .dot{background:var(--now-tx);animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .k-rev .dot{background:var(--rev-tx)}.k-fix .dot{background:var(--fix-tx)}.k-bad .dot{background:var(--bad-tx)}
  .t-tm{font-size:12.5px;color:var(--mut);white-space:nowrap}
  .t-tm b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;color:var(--tx2);margin-left:6px;font-variant-numeric:tabular-nums}
  /* Шаги задачи: пройденный — зелёный с галочкой, текущий — цветом состояния, будущий — пустой. */
  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px 12px 70px}
  .ps{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:4px 8px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--mut);font-size:12.5px;font-weight:500;line-height:1.3;text-align:center;min-width:0;overflow-wrap:anywhere}
  .ps .o{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:0 0 auto}
  .ps .f{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .ps .ic.xs{width:12px;height:12px}
  .ps.ok{background:var(--done-soft);color:var(--done-tx);border-color:currentColor}
  .ps.cur{font-weight:600;border-color:currentColor;box-shadow:0 0 0 3px var(--soft)}
  .ps.cur.now{background:var(--now-soft);color:var(--now-tx)}
  .ps.cur.rev{background:var(--rev-soft);color:var(--rev-tx)}
  .ps.cur.fix{background:var(--fix-soft);color:var(--fix-tx)}
  .ps.bad,.ps.back{background:var(--bad-soft);color:var(--bad-tx);border-color:currentColor}
  .t-note{display:flex;gap:8px;align-items:flex-start;margin:0;padding:0 16px 12px 70px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
  .t-note .ic{margin-top:2px}
  .t-note.fix{color:var(--fix-tx)}.t-note.rev{color:var(--rev-tx)}.t-note.bad{color:var(--bad-tx)}
  /* Раскрываемые подробности: всё, что о задаче записала сборка. */
  .tdet>summary{display:flex;align-items:center;gap:6px;width:fit-content;max-width:100%;min-height:32px;margin:0 16px 8px 70px;padding:2px 4px;border-radius:8px;
    list-style:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut)}
  .tdet>summary::-webkit-details-marker{display:none}
  .tdet>summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .2s}
  .tdet[open]>summary::before{transform:rotate(90deg)}
  .tdet>summary:hover{color:var(--tx)}
  .tdb{display:flex;flex-direction:column;gap:16px;padding:16px 18px 18px 70px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 15px 11px}
  .tdb h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--mut)}
  .treq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .treq:first-of-type{border-top:0;padding-top:0}
  .treq p{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .treq p b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600;margin-right:6px}
  .tkv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 18px;margin:0;font-size:13.5px;line-height:1.45}
  .tkv dt{color:var(--mut)}
  .tkv dd{margin:0;color:var(--tx);overflow-wrap:anywhere}
  .tkv code{font-size:12.5px}
  .tdb ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--tx2)}
  .tdb li{overflow-wrap:anywhere}
  .tdb li+li{margin-top:5px}

  /* ── колонки и списки ─────────────────────────────────────── */
  .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
  .col{display:flex;flex-direction:column;gap:22px;min-width:0}
  /* Фильтр слов — сегменты 0.5: серая подложка, нажатое — белое с тенью. */
  .chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:15px;background:var(--soft);width:fit-content;max-width:100%;margin-bottom:12px}
  .chip{appearance:none;height:44px;padding:0 14px;border-radius:11px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .chip i{width:9px;height:9px;border-radius:3px;display:block}
  .chip span{color:var(--quiet);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:var(--sh-tab)}
  .req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 4px;border-top:1px solid var(--line)}
  .req p{margin:0;font-size:16px;line-height:1.45;overflow-wrap:anywhere;text-wrap:pretty}
  .rid{display:inline-block;min-width:44px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--mut)}
  .why{display:block;font-size:12.5px;color:var(--quiet);margin-top:4px;padding-left:44px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;border:1px solid currentColor}
  .p-done{background:var(--done-soft);color:var(--done-tx)}
  .p-now{background:var(--now-soft);color:var(--now-tx)}
  .p-mut{background:var(--card);color:var(--mut);border-color:var(--line2)}
  .p-bad{background:var(--bad-soft);color:var(--bad-tx)}
  .more{margin-top:2px;padding-top:14px;border-top:1px solid var(--line)}
  .btn-soft{appearance:none;height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  /* Проверки — серые плитки 0.5 с отметкой-кружком. */
  .gate{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--inset);margin-top:8px}
  .whead+.gate{margin-top:0}
  .gi{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 3px 8px rgba(20,20,22,.12)}
  .gi.ok{background:var(--done-soft);color:var(--done-tx);border:1px solid currentColor}
  .gi.wait{background:var(--chrome);color:#171717}
  .gi.warn{background:var(--fix-soft);color:var(--fix-tx);border:1px solid currentColor}
  .gi.bad{background:var(--bad-soft);color:var(--bad-tx);border:1px solid currentColor}
  .gt{font-size:15px;font-weight:600;line-height:1.35}
  .gs{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.45}
  .gk{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--quiet);padding-top:3px}
  .ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .whead+.ev{border-top:0;padding-top:0}
  .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut);border:1px solid var(--line)}
  .ei.f-done{background:var(--done-soft);color:var(--done-tx);border-color:currentColor}
  .ei.f-now{background:var(--now-soft);color:var(--now-tx);border-color:currentColor}
  .ei.f-rev{background:var(--rev-soft);color:var(--rev-tx);border-color:currentColor}
  .ei.f-fix{background:var(--fix-soft);color:var(--fix-tx);border-color:currentColor}
  .ei.f-bad{background:var(--bad-soft);color:var(--bad-tx);border-color:currentColor}
  .ev>span{padding-top:2px;overflow-wrap:anywhere}
  .ev em{font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--quiet);white-space:nowrap;padding-top:4px}
  .need{padding:14px 0;border-top:1px solid var(--line)}
  .whead+.need{border-top:0;padding-top:0}
  .nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:600}
  .nh span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;font-weight:500;color:var(--mut)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .key{font-size:12.5px;padding:4px 8px;border-radius:8px;background:var(--inset);border:1px solid var(--line);color:var(--tx2);overflow-wrap:anywhere}
  .nl{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--tx2);line-height:1.5}
  .nl li{overflow-wrap:anywhere}
  .nl li+li{margin-top:7px}
  .nl.n0{margin-top:0}
  .nl+.btn-soft{margin-top:12px}
  /* «Перед запуском» — карточка ожидания 0.5: графитовая полоса слева. */
  .prep{border-left:4px solid var(--tx)}
  .prep .wt i{width:24px;height:24px;border-radius:8px;background:var(--tx);color:var(--card);display:inline-flex;align-items:center;justify-content:center}
  .blind-top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}
  .blind-top b{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .blind-top b small{font-size:16px;color:var(--mut);font-weight:600;margin-left:4px}
  .blind-top p{margin:0;flex:1 1 260px;font-size:14px;line-height:1.5;color:var(--mut)}
  .empty{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--inset);border:1.5px dashed var(--idle);font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .empty .ic{color:var(--mut);margin-top:3px}
  .muted{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:13px;color:var(--quiet);padding:6px 4px 0}
  footer code{font-size:12.5px;color:var(--tx2);overflow-wrap:anywhere}
  .stale{color:var(--now-tx);font-weight:600}

  /* Появление — один раз, при первой отрисовке: страница перерисовывается
     на каждом событии сборки, и анимация на каждом круге мигала бы. */
  .boot .w{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
  .boot .w:nth-child(2){animation-delay:.05s}.boot .w:nth-child(3){animation-delay:.1s}
  @keyframes rise{from{transform:translateY(10px);filter:blur(5px);opacity:.01}to{transform:none;filter:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.boot .w,.live,.stripes,.iconbtn.busy svg,.s-now .seg i,.k-now .dot{animation:none}.iconbtn{transition:none}}

  /* ── ширина ───────────────────────────────────────────────── */
    @media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}.gates4{grid-template-columns:repeat(2,minmax(0,1fr))}.stgs{grid-template-columns:repeat(4,minmax(0,1fr))}}
  /* Узкая панель рядом с чатом — главный способ смотреть дашборд. Здесь всё
     плотнее: те же блоки, но цифры и полосы под ширину 380–900 px, а не экрана. */
  @media (max-width:900px){
    body{font-size:14px}
    .wrap{padding:16px 16px 40px;gap:14px}
    .lost{padding:12px 16px 0}
    .top{gap:12px}
    .tools{gap:8px}
    .title h1{font-size:21px}
    .meta{margin-top:8px;gap:6px}
    .tag{padding:4px 10px;font-size:12px}
    .meta .when{font-size:12.5px}
    .card{padding:18px;border-radius:24px}
    .whead{margin-bottom:12px}
    .whead>span{font-size:12.5px}
    .hero{padding:18px;border-radius:24px;gap:18px}
    .hero-top{gap:14px;align-items:flex-start}
    .hero-main{flex-basis:100%}
    .state{font-size:12px;margin-bottom:10px;padding:5px 11px 5px 9px}
    .hero h2{font-size:20px;letter-spacing:-.01em;max-width:none}
    .lead{font-size:14px;margin-top:8px}
    .hint{font-size:13.5px;margin-top:12px;padding:8px 14px}
    .facts{gap:8px 20px}
    .rkv{grid-template-columns:minmax(0,1fr);gap:2px}

     заново каждые десять секунд, чтобы часы шли без перезагрузки.

     правке, снимок — на каждом вызове .aispa-work/ap.py, и он же вписывает
     файл в страницу, так что снимок либо равен файлу, либо старше его.
