<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Onest:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Вид — AISpa 0.5 «Графит»: центрованный лист, белые карточки 28 px на светло-сером, тёмная главная карточка с бликом,
     надзаголовки разреженными заглавными с чертой, серые плитки внутри карточек, тонированные плашки с цветной обводкой.
     Цвет здесь — сигнал, а не украшение: у каждого состояния сборки свой.
     Графит — идёт работа, хром — ждём человека, синий — таск пишется,
     зелёный — сдано, бирюзовый — проверка, янтарный — ремонт, красный — упало.
     Палитра — AISpa 0.5: графит, хром, синий, бирюзовый, ремонт #854D0E, упало #991B1B и светлые плашки.
     Производные (в 0.5 такой роли нет): --done #18784E (темнее #1F8A5B ради белого текста AA), --tx2, --line2,
     #34A56F на полосе этапов. */
  :root{
    --bg:#F4F5F6; --card:#FFFFFF; --inset:#F4F5F6; --soft:#ECEDEF; --line:#E3E4E7; --line2:#D5D7DB;
    --tx:#181A1C; --tx2:#3A3C40; --mut:#55585E; --quiet:#62666D;
    --graphite:#171717; --silver:#C7C9CC; --press:#171717; --press-tx:#FFFFFF; --press-line:transparent;
    --chrome:linear-gradient(180deg,#FFFFFF 0%,#E0E2E5 40%,#A9ACB1 62%,#EEF0F2 100%);
    --page:radial-gradient(1200px 600px at 80% -10%,#FFFFFF,transparent 70%);
    --hero:linear-gradient(165deg,#202123 0%,#0E0E10 100%);
    --hero-sh:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 rgba(255,255,255,.12);
    --done:#18784E; --done-soft:#DCFCE7; --done-tx:#166534;
    --now:#1D4ED8; --now-on:#FFFFFF; --now-soft:#DBEAFE; --now-tx:#1D4ED8;
    --rev:#0F766E; --rev-soft:#CCFBF1; --rev-tx:#0F766E;
    --fix:#854D0E; --fix-soft:#FEF3C7; --fix-tx:#854D0E;
    --bad:#991B1B; --bad-soft:#FEE2E2; --bad-tx:#991B1B;
    --idle:#C7C9CC; --eyeline:rgba(23,23,23,.45);
    --sh:0 20px 60px rgba(20,20,22,.10);
    --sh-btn:0 10px 26px rgba(23,23,23,.22);
    --sh-tab:0 4px 12px rgba(20,20,22,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
      --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
      --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
      --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
      --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
      --done-soft:#123523; --done-tx:#86EFAC;
      --now-soft:#192E50; --now-tx:#93C5FD;
      --rev-soft:#123D38; --rev-tx:#99F6E4;
      --fix-soft:#3D3217; --fix-tx:#FDE68A;
      --bad-soft:#431C22; --bad-tx:#FCA5A5;
      --idle:#5A5D63; --eyeline:rgba(255,255,255,.5);
      --sh:0 20px 60px rgba(0,0,0,.24);
      --sh-btn:0 10px 26px rgba(0,0,0,.35);
      --sh-tab:0 4px 12px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
    --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
    --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
    --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
    --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
    --done-soft:#123523; --done-tx:#86EFAC;
    --now-soft:#192E50; --now-tx:#93C5FD;
    --rev-soft:#123D38; --rev-tx:#99F6E4;
    --fix-soft:#3D3217; --fix-tx:#FDE68A;
    --bad-soft:#431C22; --bad-tx:#FCA5A5;
    --idle:#5A5D63; --eyeline:rgba(255,255,255,.5);
    --sh:0 20px 60px rgba(0,0,0,.24);
    --sh-btn:0 10px 26px rgba(0,0,0,.35);
    --sh-tab:0 4px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--page),var(--bg);color:var(--tx);
    font:15px/1.5 'Onest',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-synthesis-weight:none}
  ::selection{background:rgba(199,201,204,.4)}
  /* Фокус как в панели 0.5: контур цвета основного текста темы; на тёмных плашках — светлый контур и серебряное гало. */
  :focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  .tabs button:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.btn-soft:focus-visible{box-shadow:0 0 0 5px rgba(199,201,204,.4)}
  .hero:not(.ask) :focus-visible{outline-color:#fff;box-shadow:0 0 0 5px rgba(199,201,204,.4)}
  code,.mono{font-family:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .tnum,.big b,.tv,.s-time,.tl-time,.ev em{font-variant-numeric:tabular-nums}
  /* Лист 0.5: до 1280 px содержимого по центру, поля clamp(16px,3vw,44px), между блоками 22 px. */
  .wrap{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:28px clamp(16px,3vw,44px) 64px;display:flex;flex-direction:column;gap:22px;min-width:0}
  .wrap>*{min-width:0}
  .card{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:clamp(20px,2.4vw,30px);min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  /* Надзаголовок секции, как «— ПРОВЕРКИ» в 0.5: Unbounded 11 px, разрядка .24em, черта слева. */
  .wt{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--quiet);margin:0;line-height:1.6;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere;min-width:0}
  .wt::before{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--eyeline))}
  .whead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:13px;color:var(--quiet)}

  /* ── верх ─────────────────────────────────────────────────── */
  .top{display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap}
  /* Шапка бренда, как в 0.5: ссылка-блок на канал, знак, «AI мастерская» и «AISpa». */
  .brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-right:auto;min-width:0}
  .brand-link{display:flex;align-items:center;gap:14px;color:var(--tx);text-decoration:none;border-radius:12px}
  .brand-link:focus-visible{outline:2px solid var(--tx);outline-offset:5px}
  .brand h1{display:block;margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-weight:700;font-size:25px;line-height:1.1;letter-spacing:-.01em}
  .brand small{display:block;margin-bottom:3px;font-size:12px;color:var(--quiet)}
  .logo{width:50px;height:50px;flex:none;filter:drop-shadow(0 6px 12px rgba(20,20,22,.18))}
  .logo svg{display:block;width:100%;height:100%}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  /* Переключатели — белые с обводкой, как выпадающие списки 0.5; нажатое — графит, как текущий этап. */
  .tabs{display:inline-flex;gap:0;padding:0;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .tabs button,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tabs button{height:44px;min-width:46px;padding:0 13px;border-radius:11px;background:transparent;color:var(--mut);font-size:13px;font-weight:600;transition:background .2s,color .2s}
  .tabs button:hover{color:var(--tx)}
  .tabs button[aria-pressed="true"]{background:var(--press);color:var(--press-tx)}
  /* «Обновить» — графитовая кнопка 0.5 с тенью и подъёмом. */
  .iconbtn{width:46px;height:46px;border-radius:15px;background:var(--press);color:var(--press-tx);border:1px solid var(--press-line);box-shadow:var(--sh-btn);transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .iconbtn:hover{transform:translateY(-2px)}
  .iconbtn:active{transform:scale(.96)}
  /* «Обновить сейчас»: пока state.js грузится, стрелка крутится — нажатие видно */
  .iconbtn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title h1{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mut);line-height:1.3}
  .meta .when{font-size:13px;color:var(--mut);margin-left:4px}
  #link{background:var(--now-soft);color:var(--now-tx);border:1px solid currentColor;border-radius:12px;padding:12px 15px;font-weight:600;font-size:14px;line-height:1.5;margin-bottom:0}
  .lost{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:16px clamp(16px,3vw,44px) 0}

  /* ── шапка состояния: тёмная карточка 0.5 с серебряным бликом справа сверху ── */
  .hero{--h-tx:#fff;--h-mut:rgba(255,255,255,.82);--h-track:rgba(255,255,255,.22);--h-line:rgba(255,255,255,.14);--h-fill:rgba(255,255,255,.06);--h-cur:#383A40;--h-cur-line:#52545A;
    --glow:radial-gradient(520px 520px at calc(100% + 140px) -100px,rgba(199,201,204,.20),transparent 70%);
    border-radius:28px;padding:clamp(20px,2.4vw,30px);display:flex;flex-direction:column;gap:26px;
    background:var(--glow),var(--hero);color:var(--h-tx);box-shadow:var(--hero-sh);min-width:0}
  .hero.ask{background:var(--glow),linear-gradient(165deg,#FFFFFF 0%,#E0E2E5 45%,#C7C9CC 100%);--h-tx:#171717;--h-mut:rgba(23,23,23,.78);--h-track:rgba(23,23,23,.16);--h-line:rgba(23,23,23,.14);--h-fill:rgba(23,23,23,.05);--h-cur:#171717;--h-cur-line:#171717;
    box-shadow:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 #fff}
  .hero.won{background:var(--glow),linear-gradient(165deg,#18784E 0%,#10593A 100%);--h-mut:rgba(255,255,255,.9);--h-track:rgba(255,255,255,.26);--h-line:rgba(255,255,255,.2);--h-fill:rgba(255,255,255,.05);--h-cur:rgba(0,0,0,.22);--h-cur-line:rgba(255,255,255,.3);box-shadow:0 40px 90px rgba(24,120,78,.22),inset 0 1px 0 rgba(255,255,255,.16)}
  .hero.bad{background:var(--glow),linear-gradient(165deg,#A82121 0%,#851717 100%);--h-track:rgba(255,255,255,.26);--h-line:rgba(255,255,255,.2);--h-fill:rgba(255,255,255,.08);--h-cur:rgba(0,0,0,.22);--h-cur-line:rgba(255,255,255,.3);box-shadow:0 40px 90px rgba(153,27,27,.2),inset 0 1px 0 rgba(255,255,255,.16)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:stretch;gap:20px 40px}
  .hero-main{flex:1 1 420px;min-width:0}
  /* Состояние — плашка-пилюля 0.5 («● В работе»). */
  .state{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;background:var(--h-fill);border:1px solid var(--h-line);font-size:13px;font-weight:600;color:var(--h-tx);margin-bottom:16px}
  .hero h2{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.02em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16px;line-height:1.55;color:var(--h-mut);max-width:64ch}
  .lead b{color:var(--h-tx);font-weight:600}
  /* Время — отдельной колонкой за тонкой чертой, как сводка времени в 0.5. */
  .big{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;border-left:1px solid var(--h-line);padding-left:28px;min-width:0}
  .big b{font-family:'Unbounded','Onest',-apple-system,sans-serif;display:block;font-size:56px;line-height:.95;font-weight:700;letter-spacing:-.045em}
  .big b small{font-size:22px;letter-spacing:-.02em;font-weight:600;margin-left:6px}
  .big>span{display:block;font-size:13px;color:var(--h-mut);margin-top:10px}
  .big .paused{display:block;margin-top:6px;font-weight:600;color:var(--h-tx)}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 20px;border-radius:15px;background:#171717;color:#fff;font-size:14px;font-weight:600;line-height:1.35;box-shadow:0 10px 26px rgba(23,23,23,.22)}
  /* Этапы — сегменты 0.5: линия сверху, пройденные приглушены, текущий залит графитом. */
  .track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
  .track>div{display:flex;flex-direction:column;gap:7px;padding:9px 10px 10px;border-radius:12px;border:1px solid var(--h-line);min-width:0}
  .track>.s-done{background:var(--h-fill)}
  .track>.s-now,.track>.s-fail{background:var(--h-cur);border-color:var(--h-cur-line)}
  .hero.ask .track>.s-now{color:#fff;--h-mut:rgba(255,255,255,.82)}
  .seg{height:3px;border-radius:999px;background:var(--h-track);overflow:hidden}
  .seg i{display:block;height:100%;border-radius:inherit}
  .s-done .seg i{width:100%;background:#34A56F}
  .hero.won .s-done .seg i,.hero.bad .s-done .seg i{background:#fff}
  .hero.ask .s-done .seg i{background:#171717}
  .s-now .seg i{background:linear-gradient(90deg,#9A9DA2,#FFFFFF,#9A9DA2) 0 0/200% 100%;animation:chromeShine 2.4s linear infinite}
  .s-fail .seg i{width:100%;background:#fff}
  .s-skip{border-style:dashed!important}
  .s-skip .seg{background:repeating-linear-gradient(135deg,var(--h-track) 0 4px,transparent 4px 8px)}
  @keyframes chromeShine{from{background-position:200% 0}to{background-position:-200% 0}}
  .s-name{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .s-pend .s-name,.s-skip .s-name{color:var(--h-mut);font-weight:500}
  .s-time{display:block;margin-top:-4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--h-mut)}
  .live{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#171717}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .badge-ic{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .badge-ic .ic.xs{width:12px;height:12px}
  .hero.won .badge-ic{color:#18784E}.hero.bad .badge-ic{color:#991B1B}
  .stripes{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
  @keyframes stripes{to{background-position:22px 0}}

  /* ── плитки: белые карточки 0.5 ───────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
  .tile{display:flex;flex-direction:column;gap:12px;padding:22px 24px;border-radius:24px}
  .tk{font-size:13px;font-weight:500;color:var(--mut)}
  .tv{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:36px;line-height:1;font-weight:700;letter-spacing:-.04em}
  .tv small{font-size:16px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
  .tv.dim{color:var(--quiet)}
  .ts{font-size:13px;color:var(--mut);line-height:1.45}
  .stack{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line)}
  .stack i{display:block;height:100%}
  .stack .stripes{animation:none;background-image:none}
  .sq{display:flex;gap:5px;flex-wrap:wrap}
  .sq i{width:16px;height:16px;border-radius:5px;display:block}
  .sq .stripes{animation:none}
  .okb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:600;line-height:1.4;align-self:flex-start;border:1px solid currentColor}
  .okb.f-done{background:var(--done-soft);color:var(--done-tx)}
  .okb.f-bad{background:var(--bad-soft);color:var(--bad-tx)}

  /* ── цвета статусов ───────────────────────────────────────── */
  .f-done{background:var(--done);color:#fff}
  .f-now{background-color:var(--now);color:var(--now-on)}
  .f-rev{background:var(--rev);color:#fff}
  .f-fix{background:var(--fix);color:#fff}
  .f-bad{background:var(--bad);color:#fff}
  .f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .f-idle{background:var(--idle)}
  .f-q{background:var(--quiet)}

  /* ── ход сборки ───────────────────────────────────────────── */
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .lg{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:8px;background:var(--inset);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--tx2);line-height:1.4}
  .lg i{width:10px;height:10px;border-radius:3px;display:block}
  .lg b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;color:var(--tx)}
  /* Волна как в 0.5: хромовый шарик с номером, имя, черта между волнами. */
  .wave{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px;font-weight:600;color:var(--tx);margin:20px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
  .whead+.wave{margin-top:4px;padding-top:0;border-top:0}
  .wn{width:34px;height:34px;border-radius:999px;background:var(--chrome);box-shadow:inset 0 1px 2px #fff,0 4px 10px rgba(20,20,22,.14);display:grid;place-items:center;
    font-family:'Unbounded','Onest',sans-serif;font-style:normal;font-weight:700;font-size:13px;color:#171717;flex:0 0 auto}
  .wave span{font-weight:400;font-size:13px;color:var(--quiet)}
  .tl{display:grid;grid-template-columns:36px minmax(0,1fr) 72px;gap:4px 12px;align-items:center;margin-bottom:8px}
  .tl-id{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--mut)}
  .tl-id.on{color:var(--tx);font-weight:600}
  /* Строка таска 0.5: серая скруглённая плашка, цвет состояния — полосой слева и плашкой справа. */
  .bar{min-height:48px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;
    font-size:15px;font-weight:500;min-width:0;background:var(--inset);color:var(--tx);border:1px solid var(--line);border-left:4px solid var(--idle)}
  .bar.f-done{border-left-color:var(--done)}.bar.f-now{border-left-color:var(--now)}.bar.f-rev{border-left-color:var(--rev)}
  .bar.f-fix{border-left-color:var(--fix)}.bar.f-bad{border-left-color:var(--bad)}
  .bar.f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .bar.stripes{background-color:var(--inset);background-size:22px 22px;background-image:linear-gradient(135deg,var(--now-soft) 25%,transparent 25%,transparent 50%,var(--now-soft) 50%,var(--now-soft) 75%,transparent 75%,transparent)}

  .chipin{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;font-size:12.5px;font-weight:500;line-height:1.4;white-space:nowrap;border:1px solid currentColor;background:var(--card);color:var(--mut)}
  .f-done .chipin{background:var(--done-soft);color:var(--done-tx)}
  .f-now .chipin{background:var(--now-soft);color:var(--now-tx)}
  .f-rev .chipin{background:var(--rev-soft);color:var(--rev-tx)}
  .f-fix .chipin{background:var(--fix-soft);color:var(--fix-tx)}
  .f-bad .chipin{background:var(--bad-soft);color:var(--bad-tx)}
  .f-wait .chipin{background:var(--inset);color:var(--mut);border-color:var(--line)}
  .tl-time{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;text-align:right;color:var(--mut);white-space:nowrap}
  .tl-time.now{color:var(--now-tx)}.tl-time.fix{color:var(--fix-tx)}.tl-time.rev{color:var(--rev-tx)}.tl-time.bad{color:var(--bad-tx)}
  .tl-note{grid-column:2/4;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;padding:2px 2px 6px;overflow-wrap:anywhere}
  .tl-note.fix{color:var(--fix-tx)}.tl-note.rev{color:var(--rev-tx)}.tl-note.bad{color:var(--bad-tx)}
  .tl-note .ic{margin-top:2px}

  /* ── колонки и списки ─────────────────────────────────────── */
  .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
  .col{display:flex;flex-direction:column;gap:22px;min-width:0}
  /* Фильтр слов — сегменты 0.5: серая подложка, нажатое — белое с тенью. */
  .chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:15px;background:var(--soft);width:fit-content;max-width:100%;margin-bottom:12px}
  .chip{appearance:none;height:44px;padding:0 14px;border-radius:11px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .chip i{width:9px;height:9px;border-radius:3px;display:block}
  .chip span{color:var(--quiet);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:var(--sh-tab)}
  .req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 4px;border-top:1px solid var(--line)}
  .req p{margin:0;font-size:16px;line-height:1.45;overflow-wrap:anywhere;text-wrap:pretty}
  .rid{display:inline-block;min-width:44px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--mut)}
  .why{display:block;font-size:12.5px;color:var(--quiet);margin-top:4px;padding-left:44px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;border:1px solid currentColor}
  .p-done{background:var(--done-soft);color:var(--done-tx)}
  .p-now{background:var(--now-soft);color:var(--now-tx)}
  .p-mut{background:var(--card);color:var(--mut);border-color:var(--line2)}
  .p-bad{background:var(--bad-soft);color:var(--bad-tx)}
  .more{margin-top:2px;padding-top:14px;border-top:1px solid var(--line)}
  .btn-soft{appearance:none;height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  /* Проверки — серые плитки 0.5 с отметкой-кружком. */
  .gate{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--inset);margin-top:8px}
  .whead+.gate{margin-top:0}
  .gi{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 3px 8px rgba(20,20,22,.12)}
  .gi.ok{background:var(--done-soft);color:var(--done-tx);border:1px solid currentColor}
  .gi.wait{background:var(--chrome);color:#171717}
  .gi.warn{background:var(--fix-soft);color:var(--fix-tx);border:1px solid currentColor}
  .gi.bad{background:var(--bad-soft);color:var(--bad-tx);border:1px solid currentColor}
  .gt{font-size:15px;font-weight:600;line-height:1.35}
  .gs{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.45}
  .gk{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--quiet);padding-top:3px}
  .ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .whead+.ev{border-top:0;padding-top:0}
  .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut);border:1px solid var(--line)}
  .ei.f-done{background:var(--done-soft);color:var(--done-tx);border-color:currentColor}
  .ei.f-now{background:var(--now-soft);color:var(--now-tx);border-color:currentColor}
  .ei.f-rev{background:var(--rev-soft);color:var(--rev-tx);border-color:currentColor}
  .ei.f-fix{background:var(--fix-soft);color:var(--fix-tx);border-color:currentColor}
  .ei.f-bad{background:var(--bad-soft);color:var(--bad-tx);border-color:currentColor}
  .ev>span{padding-top:2px;overflow-wrap:anywhere}
  .ev em{font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--quiet);white-space:nowrap;padding-top:4px}

  .nh span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;font-weight:500;color:var(--mut)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .key{font-size:12.5px;padding:4px 8px;border-radius:8px;background:var(--inset);border:1px solid var(--line);color:var(--tx2);overflow-wrap:anywhere}
  .nl{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--tx2);line-height:1.5}
  .nl li{overflow-wrap:anywhere}
  .nl li+li{margin-top:7px}
  .nl.n0{margin-top:0}
  .nl+.btn-soft{margin-top:12px}
  /* «Перед запуском» — карточка ожидания 0.5: графитовая полоса слева. */
  .prep{border-left:4px solid var(--tx)}
  .prep .wt i{width:24px;height:24px;border-radius:8px;background:var(--tx);color:var(--card);display:inline-flex;align-items:center;justify-content:center}
  .blind-top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}
  .blind-top b{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .blind-top b small{font-size:16px;color:var(--mut);font-weight:600;margin-left:4px}
  .blind-top p{margin:0;flex:1 1 260px;font-size:14px;line-height:1.5;color:var(--mut)}
  .empty{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--inset);border:1.5px dashed var(--idle);font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .empty .ic{color:var(--mut);margin-top:3px}
  .muted{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:13px;color:var(--quiet);padding:6px 4px 0}
  footer code{font-size:12.5px;color:var(--tx2);overflow-wrap:anywhere}
  .stale{color:var(--now-tx);font-weight:600}

  /* Появление — один раз, при первой отрисовке: страница перерисовывается
     на каждом событии сборки, и анимация на каждом круге мигала бы. */
  .boot .w{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
  .boot .w:nth-child(2){animation-delay:.05s}.boot .w:nth-child(3){animation-delay:.1s}
  @keyframes rise{from{transform:translateY(10px);filter:blur(5px);opacity:.01}to{transform:none;filter:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.boot .w,.live,.stripes,.iconbtn.busy svg,.s-now .seg i{animation:none}.iconbtn{transition:none}}

  /* ── ширина ───────────────────────────────────────────────── */
  @media (max-width:1180px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
  /* Узкая панель рядом с чатом — главный способ смотреть дашборд. Здесь всё
     плотнее: те же блоки, но цифры и полосы под ширину 380–900 px, а не экрана. */
  @media (max-width:900px){

    .hero h2{font-size:20px;letter-spacing:-.01em;max-width:none}
    .lead{font-size:14px;margin-top:8px}
    .big{flex:1 1 100%;border-left:0;border-top:1px solid var(--h-line);padding:12px 0 0}
    .big b{font-size:30px;letter-spacing:-.03em}
    .big b small{font-size:15px}
    .big>span{font-size:12px;margin-top:4px}
    .hint{font-size:13.5px;margin-top:12px;padding:8px 14px}
    /* Как этапы 0.5 на телефоне: сегменты переносятся рядами и тянутся по ширине, слова не рвутся. */
    .track{display:flex;flex-wrap:wrap;gap:5px}
    .track>div{flex:1 1 auto;padding:7px 9px 8px;border-radius:10px;gap:5px}
    .s-name{overflow-wrap:normal;white-space:nowrap}

    .okb{font-size:11.5px;padding:3px 8px}

    .wave{font-size:14px;margin:16px 0 8px;padding-top:16px;gap:4px 8px}
    .wn{width:28px;height:28px;font-size:12px}
    .wave span{font-size:12px}
    .tl{grid-template-columns:28px minmax(0,1fr) 48px;gap:3px 8px;margin-bottom:6px}
    .tl-id{font-size:11.5px}
    .bar{min-height:40px;border-radius:10px;font-size:13.5px;padding:4px 5px 4px 10px;gap:6px}
    .chipin{padding:3px 6px;font-size:11.5px}
    .chipin .lbl{display:none}
    .tl-time{font-size:11.5px}
    .tl-note{font-size:12.5px}
    .chip{padding:0 11px;font-size:12.5px}
    .req{padding:12px 2px;gap:10px}
    .req p{font-size:14px}

    .rid{min-width:38px;font-size:11.5px}

    .gi{width:24px;height:24px}
    .gt{font-size:13.5px}.gs{font-size:12px}
    .ev{grid-template-columns:24px minmax(0,1fr) auto;font-size:13px;gap:10px;padding:10px 0}

  @media (max-width:440px){
    .hero h2{font-size:19px}

    .req .pill{justify-self:start}
  }
</style>

<body>
<!-- Плашка о потере связи живёт вне #app: render() переписывает #app целиком. -->
<div class="lost" hidden><div id="link" role="status" hidden></div></div>
<div class="wrap" id="app"></div>

<!-- Состояние приходит двумя путями, и порядок этих двух тегов — весь смысл.
     Сначала снимок, вписанный внутрь страницы: он есть всегда, поэтому дашборд
     показывает данные, чем бы его ни открыли — двойным кликом, панелью через
     data:, с мёртвым сервером, через месяц после прогона. Потом файл рядом: он
     перекрывает снимок там, где у страницы есть адрес, и он же подгружается
     заново каждые десять секунд, чтобы часы шли без перезагрузки.
     Разойтись в противоположные стороны им нечем: файл пишется на каждой
     правке, снимок — на каждом вызове .aispa-work/ap.py, и он же вписывает
     файл в страницу, так что снимок либо равен файлу, либо старше его.
     Между маркерами правит только ap.py; руками — никогда. -->
<script>/*STATE-BEGIN*/window.STATE=null;/*STATE-END*/</script>
<script src="state.js"></script>

<script>
// Полный цикл сборки. state.js может прислать меньше — недостающие показываем как pending.
const STAGE_IDS = ['preflight','manifest','briefing','spec','plan','build','review','final'];
const POLL_MS = 10000;
const IDLE_CAP_MS = 2700000;

// Шапка бренда: ссылка на канал со знаком SVG, как в 0.5 (одна разметка на оба экрана).
const BRAND = (srText) => `<div class="brand"><a class="brand-link" href="https://t.me/masterskaya_video" target="_blank" rel="noopener noreferrer"><div class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><rect width="256" height="256" rx="52" fill="#171717"/><rect x="22" y="102" width="112" height="109" rx="14" fill="#F4F5F6"/><rect x="45" y="124" width="62" height="66" rx="8" fill="#171717"/><path d="M122 211V84L173 159L224 84V211" fill="none" stroke="#F4F5F6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="33" width="24" height="24" rx="6" fill="#F4F5F6"/></svg></div><div><small>AI мастерская</small><h1>AISpa</h1></div><span class="sr-only">${srText}</span></a></div>`;

const IC = {

  chev: 'm9 18 6-6-6-6',
  up: 'm18 15-6-6-6 6',
  plus: 'M12 5v14M5 12h14',

  sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41',
  moon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z',
  sync: 'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5'
};
const ic = (n, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

const systemDark = () => {
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) { return false; }
};
const storedTheme = () => {
  try { return localStorage.getItem('aispa-theme'); } catch(e) { return null; }
};
// Явный выбор пользователя перевешивает системную тему; до первого клика — системная.
function effectiveTheme(){
  return storedTheme() || (systemDark() ? 'dark' : 'light');
}
function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 10, b = Math.abs(n) % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
};
const en = (n, one, many) => n === 1 ? one : many;
const q = (s, lang) => lang === 'en' ? `“${s}”` : `«${s}»`;

const I18N = {
  ru:{lang:"ru",of:"из",
    stages:{preflight:"Подготовка",manifest:"Требования",briefing:"Брифинг",spec:"Спецификация",
      plan:"План",build:"Разработка",review:"Код-ревью",final:"Приёмка"},
    modes:{full:"Полный автомат",semi:"Полуавтомат",interview:"Интервью",manual:"Ручной режим"},
    depths:{strict:"Строго по брифу",normal:"Обычная глубина",deep:"Максимальная глубина"},
    started:t=>`начата ${t}`,startedRange:(a,b)=>`${a} — ${b}`,today:"сегодня в",

// молча выключала опрос — и запоминала это, так что дашборд замирал навсегда.
try { localStorage.removeItem('aispa-auto'); } catch(e) {}
let pollT = null;
let pulling = false;
let misses = 0;                    // неудачных подгрузок state.js подряд
let lastStamp = null;              // метка отрисованного состояния — против лишних перерисовок
let booted = false;
// Что пользователь раскрыл и отфильтровал — переживает перерисовку на каждом событии.
const UI = {filter: 'all', open: {}};

// ——— живые таймеры ———————————————————————————————————————————————
// Всё время считается из меток state.js. Незакрытый интервал тикает от текущего момента.
const toMs = v => { const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
const spanMs = (from, to) => {
  const a = toMs(from);
  if (a == null) return null;
  const b = to ? toMs(to) : Date.now();
  return Math.max(0, (b == null ? Date.now() : b) - a);
};
// ——— активное время ——————————————————————————————————————————————
// Часы прогона показывают работу, а не календарь: ушёл человек на сутки — часы стоят.
// Промежуток между соседними метками длиннее порога — это простой, а не работа.
// Порог — сорок пять минут: на реальных прогонах работа между метками укладывается
// в час, а простои идут часами и сутками (444 минуты, 4207, 7814).
// Ожидание ответа пользователя (waits, waiting) вычитается целиком: это время
// человека, а не сборки, и на дашборде оно идёт отдельным счётчиком.
let MARKS = [];
let WAITS = [];
// `updatedAt` перезаписывается, поэтому страница помнит и то, что видела сама —
// для прогонов, начатых до журнала beats. Хранится по прогону, переживает перезагрузку.
function rememberBeats(S){
  const key = 'aispa-beats:' + (S.slug || '') + ':' + (S.startedAt || '');
  try {
    const seen = JSON.parse(localStorage.getItem(key) || '[]');
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1) {
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = toMs(v); if (t != null) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  (S.beats || []).forEach(push);
  rememberBeats(S).forEach(push);
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.tickets || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.waits || []).forEach(x => { push(x.from); push(x.to); });
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
function collectWaits(S){
  const out = [];
  (S.waits || []).forEach(w => {
    const a = toMs(w.from), b = toMs(w.to);
    if (a != null && b != null && b > a) out.push([a, b]);
  });
  if (S.waiting && !S.finishedAt) {
    const a = toMs(S.waiting.since);
    if (a != null) out.push([a, null]);
  }
  return out;
}
function waitedIn(a, b){
  let s = 0;
  WAITS.forEach(([x, y]) => {
    const hi = Math.min(b, y == null ? Date.now() : y), lo = Math.max(a, x);
    if (hi > lo) s += hi - lo;
  });
  return s;
}
// Сумма промежутков между метками без ожидания пользователя; каждый обрезан по порогу простоя.
function activeMs(from, to){
  const a = toMs(from);
  if (a == null) return null;
  const b = (to && toMs(to)) || Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const gap = pts[i] - pts[i-1] - waitedIn(pts[i-1], pts[i]);
    s += Math.min(Math.max(0, gap), IDLE_CAP_MS);
  }
  return s;
}
// Стоят ли часы прямо сейчас — то есть тянется ли простой дольше порога.
// Ожидание ответа — не простой: у него своя подпись.
function idleNow(){
  const S = window.STATE || {};
  if (!S || S.finishedAt || S.waiting) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;
}
const fmtClock = ms => {
  if (ms == null) return '—';
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
const fmtDur = m => m == null ? '—'
  : m < 60 ? m + ' ' + CUR.min : Math.floor(m/60) + ' ' + CUR.hr + ' ' + String(m%60).padStart(2,'0') + ' ' + CUR.min;
const hhmm = iso => { const t = toMs(iso); if (t == null) return ''; const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
// Открытый интервал получает data-live — его каждую секунду обновляет tick().
function timerHTML(from, to){
  const ms = activeMs(from, to);
  if (ms == null) return '—';
  return to ? fmtClock(ms) : `<span data-live data-from="${from}">${fmtClock(ms)}</span>`;
}
function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '—';
  const s = Math.floor(ms/1000);
  if (s < 60) return CUR.ago.s(s);
  const m = Math.floor(s/60);
  return m < 60 ? CUR.ago.m(m) : CUR.ago.h(Math.floor(m/60), m%60);
}
function agoShort(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '';
  const m = Math.floor(ms/60000);
  return m < 1 ? CUR.agoShort.s : m < 60 ? CUR.agoShort.m(m) : CUR.agoShort.h(Math.floor(m/60));
}
function tick(){
  const stopped = idleNow();
  document.querySelectorAll('[data-live][data-from]').forEach(el => {
    el.textContent = fmtClock(activeMs(el.dataset.from, null));
  });
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmtClock(spanMs(el.dataset.since, null));
  });
  document.querySelectorAll('[data-idle-note]').forEach(el => { el.hidden = !stopped; });
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    // Молчание — повод присмотреться, но только когда никто не работает.
    // Пока таск идёт, записей внутри него нет по устройству процесса:
    // порог тогда — не пять минут, а заметно дольше самого долгого таска.
    const S = window.STATE || {};
    const busy = (S.tickets || []).some(t =>
      t.status === 'in-progress' || t.status === 'review' || t.status === 'repair');
    el.classList.toggle('stale', !S.finishedAt && !S.waiting
      && spanMs(el.dataset.ago, null) > (busy ? 2700000 : 300000));
  });
  document.querySelectorAll('[data-ago-short]').forEach(el => {
    el.textContent = agoShort(el.dataset.agoShort);
  });
}

// ——— автообновление ——————————————————————————————————————————————
// Страница не перезагружается: она подтягивает state.js заново отдельным тегом.
// Встроенные панели (Claude Desktop, IDE-вьюверы) глушат навигацию — и
// location.reload(), и <meta http-equiv="refresh"> там молча ничего не делают,
// а загрузку подресурсов панель не трогает. Проверено измерением: reload и meta
// refresh не сработали ни разу, подгрузка тега — двенадцать раз из двенадцати.
// Но подресурсы живут только у страницы, у которой есть адрес. Панель Claude не
// открывает file:// как страницу — она вклеивает HTML в data:text/html, а оттуда
// origin равен null: state.js не грузится ни относительным путём, ни абсолютным
// file://, ни через fetch. Поэтому состояние вписано ещё и внутрь страницы.
// Живое обновление остаётся за http (панель через preview_start, обычный браузер).
// Видимость НЕ проверяем: те же панели держат document.hidden === true всё время.
// rev растёт на каждой записи ap.py — и на синхронизации, которая не меняет
// updatedAt, но может закрыть этап или пересчитать манифест.
const stampOf = S => (S.rev || '') + '|' + (S.updatedAt || '') + '|' + (S.finishedAt || '') + '|' + (S.tickets || []).length;

function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== 'object') return;
  // Перерисовываем только когда состояние действительно сдвинулось: молчаливая
  // перерисовка раз в десять секунд сбрасывала бы выделенный текст ни за что.
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  // Упавший рендер не должен убивать страницу: сбрасываем штамп, чтобы следующий
  // круг опроса попробовал заново — иначе исправленный state.js уже не подберётся.
  try { render(CUR.lang); } catch (e) { lastStamp = ''; bootFail(String(e && e.message || e)); }
  window.scrollTo(0, y);
}

// Связь проверяется только там, где она вообще бывает: по http. Из data: файл не
// грузится никогда — там снимок и тишина; file:// читается с диска без сервера.
const SERVED = /^https?:$/.test(location.protocol);
function showLink(){
  const el = document.getElementById('link');
  if (!el) return;
  const lost = SERVED && misses >= 2 && !(window.STATE && window.STATE.finishedAt);
  el.hidden = !lost;
  el.parentNode.hidden = !lost;
  if (lost) el.textContent = CUR.lost;
}

// Одна подгрузка state.js; done(ok) — когда она закончилась.
function pullState(done){
  if (pulling) return;
  pulling = true;
  const s = document.createElement('script');
  // Метка времени в запросе — иначе file:// отдаст скрипт из кеша.
  s.src = 'state.js?t=' + Date.now();
  // Ошибка — обычное дело: файл могли поймать в момент записи. Две подряд —
  // уже не запись, а мёртвый сервер: тогда страница говорит об этом.
  const end = ok => {
    s.remove();
    pulling = false;
    misses = ok ? 0 : misses + 1;
    if (ok) applyState();
    showLink();
    if (done) done(ok);
  };
  s.onload = () => end(true);
  s.onerror = () => end(false);
  document.head.appendChild(s);
}

function pollState(){
  clearTimeout(pollT);
  if (window.STATE && window.STATE.finishedAt) return;
  pollT = setTimeout(() => pullState(pollState), POLL_MS);
}

// Стрелка сверху: подтянуть state.js сейчас, не дожидаясь круга опроса.
function refreshNow(btn){
  clearTimeout(pollT);
  if (btn) btn.classList.add('busy');
  const started = Date.now();
  pullState(ok => {
    if (!ok && btn) misses = Math.max(misses, 2);  // нажал и не получил — сказать сразу
    showLink();
    // Крутится хотя бы полсекунды: мгновенный ответ иначе не отличить от «не нажалось».
    setTimeout(() => {
      document.querySelectorAll('[data-refresh]').forEach(b => b.classList.remove('busy'));
    }, Math.max(0, 500 - (Date.now() - started)));
    pollState();
  });
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Статус таска → цвет полосы, значок, подписи. Ремонт — не «ещё немного
// разработки»: таск уже написан и вернулся с ревью, поэтому у него свой цвет.
const KIND = {
  'done':        {k:'done', bar:'f-done', icon:'check'},
  'in-progress': {k:'now',  bar:'f-now stripes', icon:'pen', on:true},
  'review':      {k:'rev',  bar:'f-rev', icon:'clock', on:true},
  'repair':      {k:'fix',  bar:'f-fix', icon:'rotate', on:true},
  'failed':      {k:'bad',  bar:'f-bad', icon:'x', on:true},
  'pending':     {k:'wait', bar:'f-wait', icon:'hourglass'}
};
const kindOf = t => KIND[t.status] || KIND.pending;
const REQ_KIND = {'done':'done', 'in-ticket':'work', 'in-spec':'work', 'open':'open',
  'placeholder':'placeholder', 'deferred':'deferred', 'dropped':'dropped'};
const REQ_PILL = {done:'p-done', work:'p-mut', open:'p-mut', placeholder:'p-now', deferred:'p-mut', dropped:'p-mut'};
const REQ_RANK = {placeholder:0, deferred:1, dropped:2};

function render(lang){
  const L = I18N[lang] || I18N.ru;
  CUR = L;
  const S = STATE, T = S.tickets || [], R = S.requirements || {};
  MARKS = collectMarks(S);
  WAITS = collectWaits(S);
  const fin = !!S.finishedAt;
  const waiting = !fin && S.waiting ? S.waiting : null;

  const by = st => T.filter(t => t.status === st);
  const done = by('done'), writing = by('in-progress'), inReview = by('review'),
        inRepair = by('repair'), failedT = by('failed');
  const running = writing.concat(inReview, inRepair);
  const pending = T.length - done.length - running.length - failedT.length;
  const live = Math.max(0, (R.total || 0) - (R.dropped || 0));

  const mins = t => (t.startedAt && t.finishedAt)
    ? Math.max(1, Math.round(activeMs(t.startedAt, t.finishedAt) / 60000)) : null;
  const durations = done.map(mins).filter(Boolean).sort((a,b) => a-b);
  const median = durations.length ? durations[Math.floor(durations.length/2)] : null;

  // Этапы: канонический порядок, поверх него — то, что прислал state.js.
  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:'pending'});
  const stName = s => L.stages[s.id] || s.id;
  const activeStage = stages.find(s => s.status === 'active');
  const failedStage = stages.find(s => s.status === 'failed');
  const t0 = String(S.tier).toUpperCase() === 'T0';
  const stage = id => stages.find(s => s.id === id) || {};

  // ——— сколько осталось ———
  // По цепочке тасков в минутах, а не «медиана × длина цепочки»: иначе таск,
  // который идёт двадцать седьмую минуту, стоит в оценке как не начатый.
  // Плюс то, что идёт после разработки: ревью всей ветки и приёмка —
  // на реальных прогонах это почти половина времени, и без них оценка врала.
  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  const leftFor = t => {
    if (!t || t.status === 'done') return 0;
    const full = median || 10;
    if (t.status === 'review') return full * 0.2;
    if (t.status === 'repair') return full * 0.5;
    if (t.status === 'in-progress' && t.startedAt)
      return Math.max(1, full - (activeMs(t.startedAt, null) || 0) / 60000);
    return full;
  };
  const memo = {};
  function chainMin(id, seen){
    const t = byId[id];
    if (!t || t.status === 'done') return 0;
    if (memo[id] != null) return memo[id];
    if (seen.has(id)) return leftFor(t);
    seen.add(id);
    const d = leftFor(t) + Math.max(0, ...(t.blockedBy || []).map(b => chainMin(b, seen)));
    seen.delete(id);
    return memo[id] = d;
  }
  const cpMin = Math.max(0, ...T.map(t => chainMin(t.id, new Set())));
  const stageMin = id => { const s = stage(id); return s.startedAt ? (activeMs(s.startedAt, s.finishedAt) || 0) / 60000 : 0; };
  let left = null, lateEta = false;
  if (!fin && !waiting && !failedStage) {
    const buildSoFar = stageMin('build');
    if (activeStage && activeStage.id === 'build' && median) {
      left = cpMin + Math.max(10, 0.5 * (buildSoFar + cpMin)) + 8;
    } else if (activeStage && activeStage.id === 'review') {
      left = Math.max(5, 0.6 * buildSoFar - stageMin('review')) + 8; lateEta = true;
    } else if (activeStage && activeStage.id === 'final') {
      left = Math.max(3, 10 - stageMin('final')); lateEta = true;
    }
  }
  const eta = left ? [Math.max(1, Math.round(left * 0.75)), Math.max(2, Math.round(left * 1.4))] : null;
  const etaText = eta ? (eta[1] < 60 ? `${eta[0]}–${eta[1]}<small>${L.min}</small>`
    : `${fmtDur(eta[0])} — ${fmtDur(eta[1])}`) : '';

  // ——— шапка ———
  const names = list => list.map(t => q(esc(t.title), L.lang)).join(', ');
  let heroCls = '', stateLine, h2, lead = '', big = '', bigSub = '', hint = '';
  if (fin) {
    heroCls = 'won';
    const k = (S.debt?.emptyEnv || []).length, p = (S.debt?.placeholders || []).length;
    stateLine = `<span class="badge-ic">${ic('check','xs')}</span>${L.doneState}`;
    h2 = esc(S.result || L.doneDefault);
    lead = k || p ? L.doneNeed(k, p) : L.doneNothing;
    big = fmtClock(activeMs(S.startedAt, S.finishedAt));
    bigSub = L.doneBig(hhmm(S.finishedAt));
  } else if (waiting) {
    heroCls = 'ask';
    stateLine = `<span class="live" aria-hidden="true"></span>${L.waitState}`;
    h2 = L.waitH2[waiting.kind] || L.waitState;
    lead = waiting.note ? esc(waiting.note) : '';
    hint = `<span class="hint">${ic('msg','m')}${L.waitHint}</span>`;
    big = `<span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span>`;
    bigSub = L.waitBig;
  } else if (failedStage) {
    heroCls = 'bad';
    stateLine = `<span class="badge-ic">${ic('x','xs')}</span>${L.failState}`;
    h2 = L.failH2(stName(failedStage));
    lead = esc(failedStage.note || '');
  } else {
    const cur = activeStage || stages.find(s => s.status === 'pending') || stages[stages.length - 1];
    stateLine = `<span class="live" aria-hidden="true"></span>${L.stateRun[cur.id] || stName(cur)}`;
    if (cur.id === 'build' && T.length) {
      h2 = done.length === T.length ? L.buildAllDone(T.length) : L.buildH2(done.length, T.length, running.length);
      lead = [writing.length ? L.leadWriting(names(writing)) : '', inReview.length ? L.leadReview(names(inReview)) : '',
        inRepair.length ? L.leadRepair(names(inRepair)) : '', failedT.length ? L.leadFailed(names(failedT)) : '']
        .filter(Boolean).join(' ') || (done.length < T.length ? L.leadIdle : '');
    } else {
      h2 = L.h2Run[cur.id] || stName(cur);
      lead = cur.note ? esc(cur.note) : (L.leadRun[cur.id] || '');
    }
    if (eta) { big = etaText; bigSub = lateEta ? L.etaLate : L.etaLbl; }
    else if (cur.startedAt) { big = timerHTML(cur.startedAt, null); bigSub = L.stageClock(stName(cur)); }
  }
  // Шкала этапов: пройденное залито, текущее — в полоску, пропущенное — штриховкой.
  const segs = stages.map(s => {
    const st = s.status;
    let cls = 's-pend', fill = '0%', inner = '', time = L.ahead;
    if (st === 'done') { cls = 's-done'; fill = '100%'; time = s.startedAt ? timerHTML(s.startedAt, s.finishedAt) : '—'; }
    else if (st === 'skipped') { cls = 's-skip'; time = L.skipped; }
    else if (st === 'failed') { cls = 's-fail'; fill = '100%'; time = L.failedSt; }
    else if (st === 'active') {
      cls = 's-now'; inner = 'stripes';
      fill = s.id === 'build' && T.length ? Math.max(8, Math.round(done.length / T.length * 100)) + '%' : '50%';
      time = waiting ? L.waitingSt : (s.startedAt ? timerHTML(s.startedAt, null) : '—');
    }
    return `<div class="${cls}"><div class="seg"><i class="${inner}" style="width:${fill}"></i></div>
      <span class="s-name">${esc(stName(s))}</span><span class="s-time">${time}</span></div>`;
  }).join('');
  const hero = `<section class="hero ${heroCls} w" aria-live="polite">
    <div class="hero-top">
      <div class="hero-main"><div class="state">${stateLine}</div><h2>${h2}</h2>
        ${lead ? `<p class="lead">${lead}</p>` : ''}${hint}</div>
      ${big ? `<div class="big"><b>${big}</b><span>${bigSub}</span>
        <span class="paused" data-idle-note hidden>${L.paused}</span></div>` : ''}
    </div>
    <div class="track" role="list">${segs}</div>
  </section>`;

  // ——— плитки ———
  const reqList = S.reqList || [];
  const rk = {done:R.done||0, work:(R.inTicket||0)+(R.inSpec||0), ph:R.placeholder||0, def:R.deferred||0, drop:R.dropped||0};
  rk.open = Math.max(0, (R.total||0) - rk.done - rk.work - rk.ph - rk.def - rk.drop);
  const reqStack = `<div class="stack" aria-hidden="true">${[[rk.done,'f-done'],[rk.ph,'f-now'],[rk.work + rk.open,'f-idle'],[rk.def,'f-q']]
    .filter(x => x[0]).map(([n, c]) => `<i class="${c}" style="flex:${n}"></i>`).join('')}</div>`;
  const tileReq = `<section class="card tile w"><span class="tk">${L.tReqs}</span>${R.total
    ? `<span class="tv">${rk.done}<small>${L.of} ${live}</small></span>${reqStack}
       <span class="ts">${[L.reqParts.done, rk.work ? L.reqParts.work(rk.work) : '', rk.open ? L.reqParts.open(rk.open) : '', rk.ph ? L.reqParts.ph(rk.ph) : '',
         rk.def ? L.reqParts.def(rk.def) : '', rk.drop ? L.reqParts.drop(rk.drop) : ''].filter(Boolean).join(' · ')}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.reqLater}</span>`}</section>`;
  const retries = T.reduce((s,t) => s + (t.retries||0), 0), repairs = T.reduce((s,t) => s + (t.repairs||0), 0);
  const tileTk = `<section class="card tile w"><span class="tk">${L.tTickets}</span>${T.length
    ? `<span class="tv">${done.length}<small>${L.of} ${T.length}</small></span>
       <div class="sq" aria-hidden="true">${T.map(t => `<i class="${kindOf(t).bar}"></i>`).join('')}</div>
       <span class="ts">${(done.length === T.length
         ? [L.tkParts.all, repairs ? L.tkParts.repair(repairs) : '', retries ? L.tkParts.retry(retries) : '']
         : [writing.length ? L.tkParts.now(writing.length) : '', inReview.length ? L.tkParts.rev(inReview.length) : '',
            inRepair.length ? L.tkParts.fix(inRepair.length) : '', failedT.length ? L.tkParts.bad(failedT.length) : ''])
         .filter(Boolean).join(' · ') || L.leadIdle}</span>`
    : `<span class="tv dim">${t0 ? `<span style="font-size:.6em">${L.noSplit}</span>` : '—'}</span><span class="ts">${t0 ? '' : L.tkLater}</span>`}</section>`;
  const last = done[done.length - 1];
  const tests = S.tests || (last && last.tests) || null;
  const tileTests = `<section class="card tile w"><span class="tk">${L.tTests}</span>${tests
    ? `<span class="tv">${tests.passed}</span><span class="okb ${tests.failed ? 'f-bad' : 'f-done'}">${ic(tests.failed ? 'x' : 'check','xs')}${
        tests.failed ? L.testsBad(tests.failed) : L.testsOk}</span><span class="ts">${fin ? L.testsFinal : L.testsSub}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.testsLater}</span>`}</section>`;
  const B = S.blind;
  const tile4 = fin && B
    ? `<section class="card tile w"><span class="tk">${L.tBlind}</span><span class="tv">${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></span>
        <div class="stack" aria-hidden="true"><i class="f-done" style="flex:${+B.matched||0}"></i><i class="f-now" style="flex:${Math.max(0,(+B.checked||0)-(+B.matched||0))}"></i></div>
        <span class="ts">${L.blindSub((B.mismatches||[]).length)}</span></section>`
    : `<section class="card tile w"><span class="tk">${L.tTime}</span><span class="tv">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '—'}</span>
        <span class="ts">${L.timeSub}${median ? ' · ' + L.median(median) : ''}</span></section>`;

  // ——— ход сборки ———
  // Полоса показывает СОСТОЯНИЕ, а не долю: горизонтальная заливка в списке
  // задач читается как прогресс всегда. Длительность — цифрой справа.
  let buildCard = '';
  if (T.length) {
    const counts = {};
    T.forEach(t => { const k = kindOf(t).k; counts[k] = (counts[k] || 0) + 1; });
    const legend = ['done','now','rev','fix','bad','wait'].filter(k => counts[k]).map(k =>
      `<span class="lg"><i class="${{done:'f-done',now:'f-now',rev:'f-rev',fix:'f-fix',bad:'f-bad',wait:'f-wait'}[k]}"></i>${L.kinds[k]} <b>${counts[k]}</b></span>`).join('');
    const waves = [...new Set(T.map(t => t.wave ?? 1))].sort((a,b) => a-b);
    const rows = waves.map(w => {
      const inWave = T.filter(t => (t.wave ?? 1) === w)
        .sort((a,b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
      const blockers = [...new Set(inWave.flatMap(t => t.blockedBy || []))].filter(b => byId[b] && byId[b].status !== 'done');
      const sub = inWave.every(t => t.status === 'pending') && blockers.length ? L.waveWaits(blockers)
        : inWave.length > 1 ? L.waveSub(inWave.length) : '';
      return `<div class="wave"><i class="wn" aria-hidden="true">${esc(w)}</i>${L.wave(w)}${sub ? ` <span>${sub}</span>` : ''}</div>` + inWave.map(t => {
        const k = kindOf(t);
        const time = t.status === 'done' ? fmtDur(mins(t)) : (t.startedAt && t.status !== 'pending') ? timerHTML(t.startedAt, t.finishedAt) : '—';
        const why = String(t.review || '').replace(/^(да|yes)\s*[—–-]\s*/i, '');
        const note = t.status === 'repair' && (t.repairFindings || []).length ? ['fix', L.noteRepair(t.repairFindings[t.repairFindings.length - 1])]
          : t.status === 'review' && /^(да|yes)/i.test(t.review || '') && why ? ['rev', L.noteReview(why)]
          : t.status === 'failed' && (t.concerns || []).length ? ['bad', t.concerns.join('; ')] : null;
        const extra = t.status === 'done' && (t.repairs || t.retries)
          ? ' · ' + [t.repairs ? L.tkParts.repair(t.repairs) : '', t.retries ? L.tkParts.retry(t.retries) : ''].filter(Boolean).join(' · ') : '';
        return `<div class="tl"><span class="tl-id${k.on ? ' on' : ''}">${esc(t.id)}</span>
          <div class="bar ${k.bar}" title="${esc(t.title)}"><span class="nm">${esc(t.title)}</span>
            <span class="chipin">${ic(k.icon,'xs')}<span class="lbl">${L.chip[k.k]}${extra}</span></span></div>
          <span class="tl-time ${k.on ? k.k : ''}">${time}</span>
          ${note ? `<div class="tl-note ${note[0]}">${ic(KIND[t.status].icon)}<span>${esc(note[1])}</span></div>` : ''}</div>`;
      }).join('');
    }).join('');
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3><div class="legend">${legend}</div></div>${rows}</section>`;
  } else if (t0 && (activeStage?.id === 'build' || stage('build').status === 'done')) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.t0}</span></div></section>`;
  } else if (!fin) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.noTickets}</span></div></section>`;
  }

  // ——— списки ———
  const list = (key, arr, n, fmt) => {
    if (!arr || !arr.length) return '';
    const open = UI.open[key], shown = open ? arr : arr.slice(0, n);
    return `<ul class="nl n0">${shown.map(x => `<li>${fmt ? fmt(x) : esc(x)}</li>`).join('')}</ul>` + (arr.length > n
      ? `<button type="button" class="btn-soft" data-more="${key}">${open ? L.collapse + ic('up') : L.more(arr.length - n) + ic('chev')}</button>` : '');
  };
  // «файл:строка — суть» → адрес моноширинным, суть обычным текстом.
  const located = x => { const m = /^(\S+?(?::\d+[\w,-]*|\.\w+))\s+[—–-]\s+(.*)$/.exec(x); return m ? `<span class="mono" style="font-size:.9em;color:var(--mut)">${esc(m[1])}</span> — ${esc(m[2])}` : esc(x); };
  const env = S.debt?.emptyEnv || [], ph = S.debt?.placeholders || [], asm = S.debt?.assumptions || [];
  const keysBlock = env.length ? `<div class="need"><div class="nh">${L.envKeys}<span>${env.length}</span></div>
      <div class="keys">${env.map(k => `<code class="key">${esc(k)}</code>`).join('')}</div></div>` : '';
  const phBlock = ph.length ? `<div class="need"><div class="nh">${L.placeholders}<span>${ph.length}</span></div>${list('ph', ph, 3, located)}</div>` : '';
  const asmBlock = asm.length ? `<div class="need"><div class="nh">${L.assumptions}<span>${asm.length}</span></div>${list('asm', asm, 3)}</div>` : '';
  const needCard = fin
    ? (env.length || ph.length ? `<section class="card prep w"><div class="whead"><h3 class="wt"><i>${ic('flag')}</i>${L.prep}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section>` : '')
    : `<section class="card w"><div class="whead"><h3 class="wt">${L.need}</h3></div>${keysBlock + phBlock + asmBlock
        || `<p class="muted">${L.needEmpty}</p>`}</section>`;
  const asmCard = fin && asm.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.assumptions}</h3><span>${asm.length}</span></div>${list('asm', asm, 3)}</section>` : '';
  const report = S.report || [], concerns = S.concerns || [], additions = S.additions || [];
  const reportCard = report.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.report}</h3><span>${report.length}</span></div>${list('report', report, 3)}</section>` : '';
  const concernsCard = concerns.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.concerns}</h3><span>${concerns.length}</span></div>
      <p class="muted" style="margin-bottom:8px">${L.concernsNote}</p>${list('concerns', concerns, 3, located)}</section>` : '';
  const addCard = additions.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.additions}</h3><span>${additions.length}</span></div>${list('add', additions, 3)}</section>` : '';

  const blindCard = B ? `<section class="card w"><div class="whead"><h3 class="wt">${L.blind}</h3></div>
      <div class="blind-top"><b>${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></b><p>${L.blindNote} ${(B.mismatches||[]).length ? L.blindBad : L.blindOk}</p></div>
      ${(B.mismatches||[]).map(m => { const x = /^([RGA]\d+\w*)\s+[—–-]\s+(.*)$/.exec(m);
        return `<div class="req"><p>${x ? `<span class="rid">${esc(x[1])}</span>${esc(x[2])}` : esc(m)}</p></div>`; }).join('')}</section>` : '';

  // ——— твои слова ———
  let wordsCard = '';
  if (reqList.length) {
    const rows = reqList.map((r, i) => ({...r, k: REQ_KIND[r.status] || 'open', i}))
      .sort((a, b) => ((REQ_RANK[a.k] ?? 9) - (REQ_RANK[b.k] ?? 9)) || a.i - b.i);
    const cnt = {}; rows.forEach(r => { cnt[r.k] = (cnt[r.k] || 0) + 1; });
    const F = [['all', L.fAll, rows.length, ''], ['done', L.fDone, cnt.done, 'f-done'], ['work', L.fWork, cnt.work, 'f-idle'],
      ['open', L.fOpen, cnt.open, 'f-idle'], ['placeholder', L.fPh, cnt.placeholder, 'f-now'],
      ['deferred', L.fDef, cnt.deferred, 'f-q'], ['dropped', L.fDrop, cnt.dropped, 'f-q']].filter(f => f[2]);
    if (!F.some(f => f[0] === UI.filter)) UI.filter = 'all';
    const picked = rows.filter(r => UI.filter === 'all' || r.k === UI.filter);
    const open = UI.open.words, shown = open ? picked : picked.slice(0, 6);
    wordsCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.words}</h3><span>${L.wordsSub(rows.length)}</span></div>
      ${F.length > 2 ? `<div class="chips" role="group">${F.map(([id, lbl, n, sw]) =>
        `<button type="button" class="chip" data-filter="${id}" aria-pressed="${UI.filter === id}">${sw ? `<i class="${sw}"></i>` : ''}${lbl} <span>${n}</span></button>`).join('')}</div>` : ''}
      ${shown.map(r => `<div class="req"><div style="min-width:0"><p><span class="rid">${esc(r.id)}</span>${esc(r.text)}</p>${
        r.why ? `<span class="why">${esc(r.why)}</span>` : ''}</div><span class="pill ${REQ_PILL[r.k]}">${L.rs[r.k]}</span></div>`).join('')}
      ${picked.length > 6 ? `<div class="more"><button type="button" class="btn-soft" data-more="words">${open ? L.collapse + ic('up') : L.showAll(picked.length) + ic('chev')}</button></div>` : ''}
    </section>`;
  }

  // ——— проверки ———
  const G = Object.assign({}, S.gates || {});
  if (!G.G2 && S.coverage) G.G2 = {ok: true, found: S.coverage.found, fixed: S.coverage.fixed, deferred: S.coverage.deferred};
  if (!G.G4 && B) G.G4 = {ok: !(B.mismatches || []).length, matched: B.matched, checked: B.checked};
  const gate = (id, cls, icon, sub) => `<div class="gate"><span class="gi ${cls}">${ic(icon,'xs')}</span><div><div class="gt">${L.gT[id]}</div><div class="gs">${sub}</div></div><span class="gk">${id}</span></div>`;
  const later = (id, sub) => gate(id, 'wait', 'clock', fin ? L.gNone : sub);
  const g1 = G.G1 ? (G.G1.ok ? gate('G1','ok','check',L.g1ok(G.G1.total || R.total || 0)) : gate('G1','warn','alert',L.g1bad(G.G1.open || 0)))
    : waiting && waiting.kind === 'briefing' ? gate('G1','warn','msg',L.g1ask) : later('G1', L.g1later);
  const g2 = G.G2 ? gate('G2', G.G2.ok ? 'ok' : 'warn', G.G2.ok ? 'check' : 'alert', L.g2(+G.G2.found||0, +G.G2.fixed||0, +G.G2.deferred||0)) : later('G2', L.g2later);
  const g3 = G.G3 ? (G.G3.ok ? gate('G3','ok','check',L.g3ok(live, T.length)) : gate('G3','bad','x',L.g3bad(G.G3.problems || 0))) : later('G3', L.g3later);
  const g4 = G.G4 ? gate('G4', G.G4.ok ? 'ok' : 'warn', G.G4.ok ? 'check' : 'alert',
      L.g4(esc(G.G4.matched), esc(G.G4.checked), Math.max(0, (+G.G4.checked||0) - (+G.G4.matched||0)))) : later('G4', L.g4later);
  const okGates = ['G1','G2','G3','G4'].filter(g => G[g] && G[g].ok).length;
  const gatesCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.gates}</h3><span>${L.gatesOf(okGates)}</span></div>${g1}${g2}${g3}${g4}</section>`;

  // ——— лента ———
  const evText = e => {
    const V = L.ev;
    if (e.k === 'stage') return (V.stage[e.act] || V.stage.start)(L.stages[e.id] || e.id, e.note);
    if (e.k === 'ticket') return (V.ticket[e.act] || V.ticket.start)(e.ids || [], e.act === 'done' ? e.tests : e.note);
    if (e.k === 'gate') return (V.gate[e.g] || (() => e.g))(e.ok, e);
    if (e.k === 'add') return (V.add[e.key] || (n => `${e.key}: +${n}`))(e.n || 1);
    if (e.k === 'tickets') return V.tickets(e.n || 0);
    if (e.k === 'tests') return V.tests(e);
    if (e.k === 'ask') return V.ask(e);
    return typeof V[e.k] === 'string' ? V[e.k] : null;
  };
  const evTone = e => e.k === 'finish' ? ['f-done','flag'] : e.k === 'ask' ? ['f-now','msg'] : e.k === 'answered' ? ['','msg']
    : e.k === 'gate' ? (e.ok ? ['f-done','shield'] : ['f-now','alert'])
    : e.k === 'ticket' ? ({done:['f-done','check'], review:['f-rev','clock'], repair:['f-fix','rotate'], fail:['f-bad','x']}[e.act] || ['','play'])
    : e.k === 'stage' ? ({done:['f-done','check'], fail:['f-bad','x'], skip:['','chev']}[e.act] || ['','play'])
    : e.k === 'tests' ? [e.failed ? 'f-bad' : 'f-done', e.failed ? 'x' : 'check'] : e.k === 'add' ? ['','plus'] : ['','list'];
  const feedRows = (S.log || []).filter(e => e.k !== 'tier').slice(-12).reverse().map(e => {
    const text = evText(e);
    if (!text) return '';
    const [cls, icon] = evTone(e);
    return `<div class="ev"><span class="ei ${cls}">${ic(icon,'xs')}</span><span>${esc(text)}</span>${
      fin ? `<em>${hhmm(e.t)}</em>` : `<em data-ago-short="${esc(e.t)}">${agoShort(e.t)}</em>`}</div>`;
  }).join('');
  const feedCard = feedRows ? `<section class="card w"><div class="whead"><h3 class="wt">${L.feed}</h3>${fin ? '' :
    `<span data-ago="${esc(S.updatedAt || '')}">${S.updatedAt ? agoText(S.updatedAt) : ''}</span>`}</div>${feedRows}</section>` : '';

  // ——— раскладка ———
  // Слева — длинное (слова, ход сборки в отчёте), справа — короткое; «Понадобится»
  // слева под словами, иначе правая колонка уходит вниз, а левая стоит пустой.
  const leftCol = fin ? [needCard, blindCard, buildCard, wordsCard] : [wordsCard, needCard];
  const rightCol = fin ? [gatesCard, reportCard, asmCard, concernsCard, addCard, feedCard]
                    : [gatesCard, feedCard, reportCard, concernsCard, addCard];
  const when = S.startedAt ? (fin
    ? L.startedRange(new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}), hhmm(S.finishedAt))
    : L.started(new Date(S.startedAt).toDateString() === new Date().toDateString()
        ? `${L.today} ${hhmm(S.startedAt)}`
        : new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}))) : '';

  document.documentElement.lang = L.lang;
  const app = document.getElementById('app');
  app.innerHTML = `
  <header class="top">
    ${BRAND(L.workshopLink)}
    <div class="tools">
      ${fin ? '' : `<button type="button" class="iconbtn" data-refresh title="${L.refresh}" aria-label="${L.refresh}">${ic('sync')}</button>`}
      <div class="tabs" role="group" aria-label="${L.themeLabel}">
        <button type="button" data-theme="light" title="${L.themeLight}" aria-label="${L.themeLight}" aria-pressed="${effectiveTheme()==='light'}">${ic('sun')}</button>
        <button type="button" data-theme="dark" title="${L.themeDark}" aria-label="${L.themeDark}" aria-pressed="${effectiveTheme()==='dark'}">${ic('moon')}</button>
      </div>
      <div class="tabs" role="group" aria-label="${L.langLabel}">
        <button type="button" data-lang="ru" aria-pressed="${L.lang==='ru'}">RU</button>
        <button type="button" data-lang="en" aria-pressed="${L.lang==='en'}">EN</button>
      </div>
    </div>
  </header>
  <div class="title">
    <h1>${esc(S.title)}</h1>
    <div class="meta">${S.mode ? `<span class="tag">${esc(L.modes[S.mode] || S.mode)}</span>` : ''}${
      S.depth ? `<span class="tag">${esc(L.depths[S.depth] || S.depth)}</span>` : ''}<span class="when">${when}</span></div>
  </div>
  ${hero}
  <div class="tiles">${tileReq}${tileTk}${tileTests}${tile4}</div>
  ${fin ? '' : buildCard}
  <div class="cols"><div class="col">${leftCol.join('')}</div><div class="col">${rightCol.join('')}</div></div>
  <footer>
    <span>${L.filesIn} <code>.aispa-work/${esc(S.dir || S.slug)}/</code></span>
    <span>${fin ? L.frozen : `${L.updated}: <span data-ago="${esc(S.updatedAt || '')}"
      title="${S.updatedAt ? esc(new Date(S.updatedAt).toLocaleString(L.lang==='en'?'en-GB':'ru-RU')) : ''}">${S.updatedAt ? agoText(S.updatedAt) : '—'}</span>`}</span>
  </footer>`;

  // Вкладка подписана проектом: когда репозиторий дорабатывают второй раз, это
  // единственное место, где видно, что на экране прошлый прогон. Пока сборка ждёт
  // человека, вкладка говорит об этом — её видно, даже когда дашборд в фоне.
  document.title = (waiting ? L.tabWait + ' — ' : '') + (S.title ? `${S.title} — AISpa` : 'AISpa');

  if (!booted) {
    booted = true;
    app.classList.add('boot');
    setTimeout(() => app.classList.remove('boot'), 1400);
  }
  tick();
  showLink();
  if (!pulling) pollState();
}

// Один обработчик на всё: #app переписывается целиком на каждом событии сборки.
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) {
    try { localStorage.setItem('aispa-lang', b.dataset.lang); } catch(err) {}
    render(b.dataset.lang);
  } else if (b.dataset.theme) {
    const t = b.dataset.theme;
    try { localStorage.setItem('aispa-theme', t); } catch(err) {}
    applyTheme(t);
    document.querySelectorAll('button[data-theme]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.theme === t)));
  } else if (b.hasAttribute('data-refresh')) {
    refreshNow(b);
  } else if (b.dataset.filter) {
    UI.filter = b.dataset.filter; UI.open.words = false; render(CUR.lang);
  } else if (b.dataset.more) {
    UI.open[b.dataset.more] = !UI.open[b.dataset.more]; render(CUR.lang);
  }
});

let savedLang = 'ru';
try { savedLang = localStorage.getItem('aispa-lang')
  || ((navigator.language || '').startsWith('ru') ? 'ru' : 'en'); } catch(e) {}

applyTheme(storedTheme());

// Пустой экран не говорит, что сломалось, поэтому страница объясняет — и не
// сдаётся: опрос продолжается, и когда файл появится, дашборд оживёт сам.
function bootFail(why){
  const app = document.getElementById('app');
  if (!app) return;
  const L = I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'];
  app.innerHTML = `<header class="top">${BRAND(L.workshopLink)}</header>
    <section class="card"><h3 class="wt">${L.boot}</h3><p class="muted" style="margin-top:10px">${why}</p>
    <p class="muted" style="margin-top:10px">${L.bootHelp}</p></section>`;
}

if (typeof STATE === 'undefined' || !STATE || typeof STATE !== 'object') {
  bootFail(I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'].bootWhy);
  pollState();
} else {
  try {
    render(I18N[savedLang] ? savedLang : 'ru');
    lastStamp = stampOf(STATE);
  } catch (e) {
    bootFail(esc(String(e && e.message || e)));
    pollState();
  }
}

// Секундная стрелка для всех незакрытых интервалов и для «обновлено N назад».
setInterval(tick, 1000);

// Возврат на вкладку — повод не ждать очередного круга опроса.
// После сна компьютера — тоже: таймеры страницы стояли вместе с ним.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); refreshNow(); } });
window.addEventListener('pageshow', e => { if (e.persisted) { tick(); refreshNow(); } });

// Пока пользователь не выбрал тему явно, дашборд следует за системной.
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (storedTheme()) return;
    document.querySelectorAll('button[data-theme]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.theme === effectiveTheme())));
  });
} catch(e) {}
</script>
</body>
</html>
