interface:
  display_name: "AISpa"
  short_description: "Разработка по брифу с проверяемой приёмкой"
  default_prompt: "Используй $aispa для моего проекта. Если поручен только audit-only осмотр без изменений, сначала выполни assess: ограниченное filesystem-чтение без записи, init, update-check, команд и дашборда; покажи факты, ограничения и предложенный ремонт. Для обычной разработки первым действием выполни update-check установленного пакета, затем предложи выбор режима вопросов и режима проверки (по умолчанию сбалансированно). Сразу после init или при продолжении существующего прогона выполни dashboard start и открой панель одним действием open-dashboard из его ответа видимой вкладкой встроенного браузера Codex до остальных этапов; повторную вкладку не создавай. После seal работай без остановок: в Codex, закрыв волну, в том же ходе открой следующую; ход заканчивай только финалом, блокером или вопросом, который разрешает режим."
policy:
  allow_implicit_invocation: false
