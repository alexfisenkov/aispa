interface:
  display_name: "AISpa"
  short_description: "Разработка по брифу с проверяемой приёмкой"
  default_prompt: "Используй $aispa для моего проекта. Первым действием выполни update-check установленного пакета, затем предложи выбор режима работы. Сразу после init или при продолжении существующего прогона выполни dashboard start и обязательно открой его URL видимой вкладкой встроенного браузера Codex до остальных этапов."
policy:
  allow_implicit_invocation: false
