interface:
  display_name: "AISpa"
  short_description: "Разработка по брифу с проверяемой приёмкой"
  default_prompt: "Используй $aispa для моего проекта: работай по SKILL.md пакета, фазу за фазой. Модель и усилие каждого субагента бери из таблицы в SKILL.md и передавай явно при каждом запуске. Закрыв волну, в том же ходе открой следующую; ход заканчивай только финалом, блокером или вопросом, который разрешает режим."
policy:
  allow_implicit_invocation: false
