name: AISpa checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    # Windows runs the subprocess-heavy CLI suites several times slower.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Managed dashboard startup smoke
        working-directory: tests
        run: python -B -m unittest test_dashboard_server.DashboardServerTests.test_start_status_stop_and_port_reuse -v
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Study-plan pilot example tests
        working-directory: examples/study-plan
        run: python -B -m unittest discover -s tests -v
      - name: Dashboard behavior tests
        if: matrix.python == '3.13'
        run: node --test tests/dashboard.test.cjs
