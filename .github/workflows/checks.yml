name: AISpa checks
# One full run on the final version, started by hand; never on push or pull request.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope (the whole suite)
        type: choice
        default: full
        options: [full]
permissions:
  contents: read
jobs:
  python:
    if: inputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The compatibility tests read published tags (old installers and updaters).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: All unittest modules
        env:
          PYTHONUTF8: '1'
        run: python -B -m unittest discover -s tests -v
      - name: Node tests (only when tests/*.test.cjs exist)
        if: matrix.python == '3.13' && hashFiles('tests/*.test.cjs') != ''
        shell: bash
        run: node --test tests/*.test.cjs
